name: Feature or check idea
description: Suggest a new quality check, playbook improvement or workflow
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What goes wrong today, or what a post is missing? A real example helps most.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should the skill or a script do? For a claim about how search engines or AI assistants behave, link the primary source.
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to open a pull request for this
