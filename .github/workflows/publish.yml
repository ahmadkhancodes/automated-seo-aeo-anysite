name: publish
# Publishes the CLI to npm with provenance. Runs when a GitHub release is published,
# or by hand from the Actions tab (Run workflow). Needs the NPM_TOKEN repository secret.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm run qa:example
      - name: Skip if this version is already on npm
        id: check
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "automated-seo-aeo-anysite@$v" version >/dev/null 2>&1; then
            echo "Version $v is already published; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
